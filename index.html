<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議室預約看板</title>
<style>
  /* 設計變數：低飽和莫蘭迪色系 */
  :root {
    --bg: #e8f4fb;
    --card: #ffffff;
    --ink: #2b3a4a;
    --muted: #7a8ea3;
    --line: #dbe8f2;
    --accent: #0a9bdc;
    --accent-dark: #0782ba;
    --accent-soft: #d4edfa;
    --danger: #e0626b;
    --danger-soft: #fde8ea;
    --shadow: 0 2px 4px rgba(10, 100, 160, .05), 0 8px 24px rgba(10, 100, 160, .09);
    --shadow-hover: 0 4px 8px rgba(10, 100, 160, .08), 0 12px 28px rgba(10, 100, 160, .16);
    --ease: cubic-bezier(.22, .8, .36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px 56px;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* 通用小卡 */
  .card {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    padding: 22px; animation: rise .6s var(--ease) both;
    transition: box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  .card:hover { box-shadow: var(--shadow-hover); }
  .container > .card:nth-child(2) { animation-delay: .08s; }
  .container > .card:nth-child(3) { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .04em; }
  .subtitle { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar .date-label { font-weight: 600; min-width: 150px; text-align: center; font-size: 15px; }
  .toolbar-top { margin-top: 18px; justify-content: space-between; }

  /* 按鈕 */
  button {
    font: inherit; font-size: 14px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: background .25s var(--ease), transform .2s var(--ease), box-shadow .25s var(--ease), border-color .25s;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(10, 100, 160, .15); }
  button:active { transform: translateY(0) scale(.95); box-shadow: none; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 10px 28px; }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  /* 時間軸 */
  .timeline-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .timeline { min-width: 820px; }
  .row { display: flex; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row-label {
    flex: 0 0 96px; padding: 8px 12px; font-weight: 600; font-size: 14px; background: #f2f8fc;
    border-right: 1px solid var(--line); display: flex; align-items: center;
    position: sticky; left: 0; z-index: 2;
  }
  .header .row-label { color: var(--muted); font-weight: 500; font-size: 12px; }
  .track {
    flex: 1; position: relative; height: 62px;
    background-image: linear-gradient(to right, #e6f0f7 1px, transparent 1px);
  }
  .header .track { height: 30px; }
  .tick { position: absolute; top: 7px; font-size: 12px; color: var(--muted); transform: translateX(4px); }
  .booking {
    position: absolute; top: 6px; bottom: 6px; padding: 2px 10px;
    background: var(--accent-soft); color: #0b5f8a; border-radius: 10px; font-size: 12px;
    overflow: hidden; line-height: 1.35;
    border-left: 3px solid var(--accent);
    display: flex; align-items: center; gap: 6px;
    transform-origin: left center;
    animation: pop .45s var(--ease) both;
    transition: box-shadow .25s var(--ease), transform .25s var(--ease), background .25s;
  }
  .booking:hover { background: #bfe3f7; box-shadow: 0 4px 12px rgba(10, 130, 190, .28); transform: translateY(-1px); z-index: 1; }
  @keyframes pop { from { opacity: 0; transform: scaleX(.6) translateY(4px); } to { opacity: 1; transform: none; } }
  .booking .info { flex: 1; min-width: 0; }
  .booking b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .booking span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; opacity: .75; }
  .booking .cancel {
    flex: none; padding: 2px 9px; font-size: 11px; line-height: 1.5;
    color: var(--danger); border-color: transparent; background: rgba(255, 255, 255, .7);
  }
  .booking .cancel:hover { background: var(--danger-soft); border-color: var(--danger); }
  .hint { font-size: 12px; color: var(--muted); margin: 12px 2px 0; }

  /* 表單 */
  form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; }
  form h2 { grid-column: 1 / -1; margin: 0; font-size: 16px; font-weight: 600; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input, select {
    font: inherit; font-size: 14px; color: var(--ink); padding: 10px 12px; width: 100%;
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
    transition: border-color .25s, box-shadow .25s;
  }
  input:hover, select:hover { border-color: #b5d3e8; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .full { grid-column: 1 / -1; }
  #error {
    grid-column: 1 / -1; color: #a8434c; background: var(--danger-soft); padding: 10px 14px;
    border-radius: 12px; display: none; font-size: 14px;
  }
  #error.show { display: block; animation: shake .45s var(--ease); }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

  @media (max-width: 600px) {
    body { padding: 20px 10px 40px; }
    .card { padding: 16px; border-radius: 16px; }
    form { grid-template-columns: 1fr; }
    .toolbar-top { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="container">
  <section class="card">
    <h1>會議室預約看板</h1>
    <p class="subtitle">選擇日期，一眼看見每間會議室的使用狀況</p>
    <div class="toolbar toolbar-top">
      <div class="toolbar">
        <button type="button" id="btnPrev">◀ 前一天</button>
        <button type="button" id="btnToday">今天</button>
        <button type="button" id="btnNext">後一天 ▶</button>
        <span class="date-label" id="dateLabel"></span>
      </div>
      <button type="button" id="btnExport">匯出 CSV</button>
    </div>
  </section>

  <section class="card">
    <div class="timeline-wrap"><div class="timeline" id="timeline"></div></div>
    <p class="hint">按預約色塊上的「取消」可取消該筆預約。資料僅存在此瀏覽器中。</p>
  </section>

  <section class="card">
    <form id="bookingForm" novalidate>
      <h2>新增預約</h2>
      <label>會議室
        <select id="fRoom"></select>
      </label>
      <label>日期
        <input type="date" id="fDate">
      </label>
      <label>開始時間
        <select id="fStart"></select>
      </label>
      <label>結束時間
        <select id="fEnd"></select>
      </label>
      <label class="full">會議主題
        <input type="text" id="fTitle" maxlength="50">
      </label>
      <label class="full">預約人姓名
        <input type="text" id="fName" maxlength="20">
      </label>
      <div id="error" role="alert"></div>
      <div class="full"><button type="submit" class="primary">送出預約</button></div>
    </form>
  </section>
</div>

<script>
// ===== 設定常數（可於此調整）=====
const ROOMS = ['A 會議室', 'B 會議室', 'C 會議室']; // 會議室清單（3～5 間）
const DAY_START = 8;   // 可預約起始時（24 小時制）
const DAY_END = 18;    // 可預約結束時
const SLOT_MIN = 30;   // 時間單位（分鐘）
const STORAGE_KEY = 'room-bookings-v1';

// ===== 時間工具 =====
const pad = n => String(n).padStart(2, '0');
const toMinutes = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toTime = min => pad(Math.floor(min / 60)) + ':' + pad(min % 60);
// 以本機時區產生 YYYY-MM-DD
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

// ===== 資料層 =====
function loadBookings() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return []; // 資料損毀或無法存取時視為空
  }
}
function saveBookings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
    return true;
  } catch (e) {
    return false;
  }
}

let bookings = loadBookings();
let viewDate = fmtDate(new Date());

// 同房同日，開始 < 既有結束 且 結束 > 既有開始 即重疊；首尾相接不算
function findOverlap(room, date, start, end) {
  const s = toMinutes(start), e = toMinutes(end);
  return bookings.find(b =>
    b.room === room && b.date === date &&
    s < toMinutes(b.end) && e > toMinutes(b.start)
  );
}

// 回傳錯誤訊息；無錯誤回傳空字串
function validate(v) {
  if (!v.room || !v.date || !v.start || !v.end) return '請填寫所有欄位。';
  if (!v.title.trim()) return '會議主題不可空白。';
  if (!v.name.trim()) return '預約人姓名不可空白。';
  if (toMinutes(v.end) <= toMinutes(v.start)) return '結束時間必須晚於開始時間。';
  if (toMinutes(v.start) < DAY_START * 60 || toMinutes(v.end) > DAY_END * 60) {
    return '預約時段須在 ' + pad(DAY_START) + ':00–' + pad(DAY_END) + ':00 之間。';
  }
  const clash = findOverlap(v.room, v.date, v.start, v.end);
  if (clash) {
    return '時段衝突：' + v.room + ' 在 ' + clash.start + '–' + clash.end +
           ' 已被「' + clash.name + '」預約（' + clash.title + '）。';
  }
  return '';
}

// ===== 畫面 =====
const $ = id => document.getElementById(id);
const totalMin = (DAY_END - DAY_START) * 60;
const pct = min => ((min - DAY_START * 60) / totalMin * 100) + '%';

function render() {
  const d = parseDate(viewDate);
  $('dateLabel').textContent = viewDate + '（週' + WEEK[d.getDay()] + '）';
  const tl = $('timeline');
  tl.innerHTML = '';

  // 表頭：每小時一個刻度
  const head = document.createElement('div');
  head.className = 'row header';
  head.innerHTML = '<div class="row-label">會議室</div>';
  const ht = document.createElement('div');
  ht.className = 'track';
  for (let h = DAY_START; h < DAY_END; h++) {
    const t = document.createElement('div');
    t.className = 'tick';
    t.style.left = pct(h * 60);
    t.textContent = pad(h) + ':00';
    ht.appendChild(t);
  }
  head.appendChild(ht);
  tl.appendChild(head);

  // 每間會議室一列
  ROOMS.forEach(room => {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = room;
    const track = document.createElement('div');
    track.className = 'track';
    // 以格線標示每 30 分鐘
    track.style.backgroundSize = (SLOT_MIN / totalMin * 100) + '% 100%';

    bookings
      .filter(b => b.room === room && b.date === viewDate)
      .forEach(b => {
        const el = document.createElement('div');
        el.className = 'booking';
        el.style.left = pct(toMinutes(b.start));
        el.style.width = ((toMinutes(b.end) - toMinutes(b.start)) / totalMin * 100) + '%';
        el.title = b.start + '–' + b.end + ' ' + b.title + '（' + b.name + '）';
        const t1 = document.createElement('b');
        t1.textContent = b.title;
        const t2 = document.createElement('span');
        t2.textContent = b.name + ' ' + b.start + '–' + b.end;
        const info = document.createElement('div');
        info.className = 'info';
        info.append(t1, t2);
        // 取消按鈕：確認後才刪除
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cancel';
        btn.textContent = '取消';
        btn.addEventListener('click', () => deleteBooking(b.id));
        el.append(info, btn);
        track.appendChild(el);
      });

    row.append(label, track);
    tl.appendChild(row);
  });
}

function showError(msg) {
  const el = $('error');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth; // 強制重排，讓連續錯誤也能重播抖動動畫
  el.classList.toggle('show', !!msg);
}

function shiftDate(days) {
  const d = parseDate(viewDate);
  d.setDate(d.getDate() + days);
  setViewDate(fmtDate(d));
}
function setViewDate(s) {
  viewDate = s;
  $('fDate').value = s; // 表單日期跟隨目前檢視日
  render();
}

function deleteBooking(id) {
  const b = bookings.find(x => x.id === id);
  if (!b) return;
  if (!confirm('確定要取消預約？\n' + b.room + ' ' + b.date + ' ' + b.start + '–' + b.end + '\n' + b.title + '（' + b.name + '）')) return;
  bookings = bookings.filter(x => x.id !== id);
  saveBookings();
  render();
}

// ===== 匯出 CSV =====
// 欄位加雙引號並跳脫；開頭為 = + - @ 的文字加 ' 前綴，避免 Excel 當成公式執行
function csvCell(v) {
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

// 匯出所有預約（依日期、開始時間、會議室排序）
function exportCsv() {
  if (!bookings.length) { alert('目前沒有任何預約可匯出。'); return; }
  const rows = bookings.slice().sort((a, b) =>
    a.date.localeCompare(b.date) || toMinutes(a.start) - toMinutes(b.start) ||
    ROOMS.indexOf(a.room) - ROOMS.indexOf(b.room));
  const lines = [['日期', '會議室', '開始時間', '結束時間', '會議主題', '預約人姓名']]
    .concat(rows.map(b => [b.date, b.room, b.start, b.end, b.title, b.name]))
    .map(r => r.map(csvCell).join(','));
  // 加上 BOM 讓 Excel 正確顯示繁體中文
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '會議室預約_' + fmtDate(new Date()) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ===== 初始化表單 =====
function initForm() {
  $('fRoom').innerHTML = ROOMS.map(r => '<option>' + r + '</option>').join('');
  const starts = [], ends = [];
  for (let m = DAY_START * 60; m <= DAY_END * 60; m += SLOT_MIN) {
    if (m < DAY_END * 60) starts.push(toTime(m));
    if (m > DAY_START * 60) ends.push(toTime(m));
  }
  $('fStart').innerHTML = starts.map(t => '<option>' + t + '</option>').join('');
  $('fEnd').innerHTML = ends.map(t => '<option>' + t + '</option>').join('');
  $('fEnd').value = ends[1] || ends[0]; // 預設 1 小時

  $('bookingForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = {
      room: $('fRoom').value, date: $('fDate').value,
      start: $('fStart').value, end: $('fEnd').value,
      title: $('fTitle').value, name: $('fName').value
    };
    const msg = validate(v);
    showError(msg);
    if (msg) return;
    bookings.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      room: v.room, date: v.date, start: v.start, end: v.end,
      title: v.title.trim(), name: v.name.trim()
    });
    if (!saveBookings()) showError('預約已加入，但無法寫入瀏覽器儲存空間，重新整理後可能遺失。');
    $('fTitle').value = '';
    viewDate = v.date; // 切到剛預約的日期，讓使用者看到結果
    setViewDate(v.date);
  });

  $('btnPrev').addEventListener('click', () => shiftDate(-1));
  $('btnNext').addEventListener('click', () => shiftDate(1));
  $('btnToday').addEventListener('click', () => setViewDate(fmtDate(new Date())));
  $('btnExport').addEventListener('click', exportCsv);
}

initForm();
setViewDate(viewDate);
</script>
</body>
</html>
